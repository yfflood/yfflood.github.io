<ul class="blog-list">
  {% for post in include.posts %}
  {% assign post_url = post.url | relative_url %}
  <li>
    <h3><a href="{{ post.link | default: post_url | escape }}">{{ post.title | escape }}</a></h3>
    <p class="blog-meta">
      <time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: '%B %-d, %Y' }}</time>
      {% if post.read_time %}<span aria-hidden="true">·</span> {% include read-time.html %}{% endif %}
    </p>
  </li>
  {% endfor %}
</ul>
